<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- The red bolt from the FRONTL1NE logo on the app's dark tile. Render to icon.png with `pnpm --filter @frontline/desktop icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b20"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#2c2c33" stroke-width="4"/>
  <path d="M152 32 L74 142 H120 L98 224 L184 108 H136 Z" fill="#ff2a3a" filter="url(#glow)"/>
</svg>
